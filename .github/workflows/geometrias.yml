name: Preparar geometrías

# El fichero europeo de unidades administrativas pesa mucho: se descarga en el
# runner, se recorta a la provincia y al repositorio llega sólo el resultado.
# Sólo hace falta rehacerlo si GISCO publica una edición nueva.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recortar los municipios de Castellón
        run: python scripts/descargar_geometrias.py
      - name: Commitear
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/geo/
          git diff --staged --quiet || git commit -m "Geometrías municipales de Castellón [skip ci]"
          git push
