name: Publicar en GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llegan varias, gana la última.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    # Sólo se publica la rama por defecto del repositorio.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la hoja de estilos
        run: npm run build:css

      - name: Comprobar que el CSS commiteado está al día
        run: |
          if ! git diff --quiet -- assets/css/app.css; then
            echo "::warning::assets/css/app.css no coincide con el compilado; se publica el recién compilado."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
