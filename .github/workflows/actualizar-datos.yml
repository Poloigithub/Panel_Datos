name: Actualizar datos

# Se mira todos los días de madrugada. Las fuentes publican cada una por su
# lado -el SEPE a principios de mes, el INE a mitad, el CGPJ por trimestres- y
# mirar a diario es lo único que hace que un dato aparezca aquí al día
# siguiente de salir sin que nadie tenga que acordarse de nada. Si no hay nada
# nuevo, el run no toca el repositorio: los descargadores escriben lo mismo y
# el commit no llega a hacerse.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # Para poder abrir la incidencia de aviso cuando algo falle.
  issues: write

# Dos actualizaciones a la vez se pisarían al commitear.
concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar series de la EPA
        run: python scripts/descargar_epa.py

      - name: Descargar los bloques sociodemográficos
        run: python scripts/descargar_sociodemografia.py

      # Después de los sociodemográficos: el esfuerzo de acceso a la vivienda
      # se calcula contra la renta por hogar que escribe ese descargador.
      - name: Descargar el bloque de vivienda
        run: python scripts/descargar_vivienda.py

      - name: Descargar salarios y rentas del trabajo
        run: python scripts/descargar_salarios.py

      - name: Descargar la cesta de la compra
        run: python scripts/descargar_cesta.py

      - name: Descargar el paro registrado y los contratos del SEPE
        run: python scripts/descargar_paro.py

      # La afiliación va antes que los accidentes, y no da igual: los
      # accidentes se dividen entre ella para dar la tasa por cada cien mil
      # afiliados, así que si llegara después la tasa saldría con el
      # denominador del día anterior.
      - name: Descargar la afiliación a la Seguridad Social
        run: python scripts/descargar_afiliacion.py

      - name: Descargar los accidentes de trabajo
        run: python scripts/descargar_siniestralidad.py

      - name: Componer los titulares, el catálogo y la descarga completa
        run: |
          python scripts/generar_portada.py
          python scripts/generar_catalogo.py

      # Si algo no cuadra, el run se para aquí y no se publica nada.
      - name: Validar los datos descargados
        run: python scripts/validar_datos.py

      - name: Commitear si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ config/
          if git diff --staged --quiet; then
            echo "Ningún organismo ha publicado nada nuevo; no se toca el repositorio."
            exit 0
          fi
          ULTIMO=$(python -c "import json;print(json.load(open('data/epa/index.json'))['ultimo_periodo'])")
          git commit -m "Actualiza los datos (EPA: ${ULTIMO})"
          git pull --rebase origin ${{ github.ref_name }}
          git push

      # Va después de commitear porque lee el historial: si se generase antes,
      # la actualización de hoy no aparecería en su propio registro.
      - name: Anotar los cambios
        run: |
          python scripts/generar_cambios.py
          git add data/cambios.json
          if git diff --staged --quiet; then
            echo "Sin cambios que anotar."
            exit 0
          fi
          git commit -m "Anota los cambios [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push

      # Va al final y aparte: que una fuente se haya quedado atrás no debe
      # impedir publicar lo que sí ha llegado, pero sí tiene que hacer ruido.
      - name: Comprobar que ninguna fuente se ha quedado atrás
        run: python scripts/validar_datos.py --frescura

      # GitHub manda su propio correo cuando un workflow programado falla, pero
      # dice poco más que «ha fallado». Esto abre una incidencia con el paso
      # concreto y el enlace al registro, y al abrirse GitHub avisa por correo a
      # quien sigue el repositorio. Sin contraseñas ni servidores de correo.
      - name: Avisar si algo ha fallado
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAREA: ${{ github.workflow }}
        run: |
          FECHA=$(date -u '+%d/%m/%Y a las %H:%M UTC') python scripts/avisar_fallo.py
