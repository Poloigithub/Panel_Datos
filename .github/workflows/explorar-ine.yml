name: Explorar catálogo del INE

# Herramienta de diagnóstico manual sobre la API del INE.
on:
  workflow_dispatch:

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnóstico de DATOS_SERIE
        run: python scripts/diagnostico_serie.py
