name: Explorar catálogo del INE

# Diagnóstico manual sobre la API del INE. Vuelca a data/_catalogo/ y, cuando
# se prueba un descargador, deja también sus ficheros para poder revisarlos.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnóstico de las búsquedas fallidas
        run: python scripts/diagnostico_sociodemografia.py
      - name: Commitear el resultado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ config/
          git diff --staged --quiet || git commit -m "Prueba de descarga sociodemográfica [skip ci]"
          git push
