name: Explorar fuentes externas

# Diagnóstico manual de fuentes que no son la API del INE: qué responden y en
# qué formato, antes de escribir ningún parser.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sondear las fuentes
        run: python scripts/explorar_paro.py
      - name: Commitear el volcado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/_catalogo/
          git diff --staged --quiet || git commit -m "Sondeo de fuentes de paro registrado [skip ci]"
          git push
