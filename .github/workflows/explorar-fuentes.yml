name: Explorar fuentes externas

# Reconstrucción completa de las estadísticas del SEPE: descarga todos los
# años, que es caro y sólo hace falta la primera vez o al cambiar el parser.
on:
  workflow_dispatch:
    inputs:
      desde:
        description: 'Primer año a descargar'
        required: false
        default: '2006'

permissions:
  contents: write

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar el histórico del SEPE
        run: python scripts/descargar_paro.py --desde ${{ inputs.desde }}

      - name: Commitear
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --staged --quiet || git commit -m "Reconstruye el histórico de paro registrado [skip ci]"
          git push
